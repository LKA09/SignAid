[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaid"
version = "0.2.0"
description = "Emergency Korean Sign Language communication service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "py7zr>=1.1",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
signaid = "signaid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["signaid*", "app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
